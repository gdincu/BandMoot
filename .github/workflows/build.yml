name: Build debug APK

# Builds app-debug.apk on every push/PR without needing Android Studio locally.
# Result: Actions tab -> this run -> Artifacts -> bandmoot-debug -> install on phone.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # NOTE: android-actions/setup-android is intentionally NOT used: v3 requests
      # the obsolete 'tools' package and fails (sdkmanager exit 1). The runner
      # image already ships an Android SDK; we just top up what's missing.
      - name: Install Android platform + build-tools (compileSdk 34)
        run: |
          set -o pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7 (no wrapper in repo)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee gradle.log

      - name: List outputs
        if: always()
        run: |
          echo "=== apk ==="; ls -lh app/build/outputs/apk/debug 2>&1 || true
          echo "=== find apk ==="; find . -maxdepth 5 -name "*.apk" | xargs ls -lh 2>&1 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: gradle-log, path: gradle.log, if-no-files-found: warn}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with: {name: bandmoot-debug, path: app/build/outputs/apk/debug/app-debug.apk, if-no-files-found: warn}
