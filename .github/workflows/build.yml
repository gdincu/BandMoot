name: Build APKs

# Builds debug + release APKs on every push/PR without needing Android Studio locally.
# Result: Actions tab -> this run -> Artifacts -> bandmoot-debug / bandmoot-release.
# - bandmoot-debug: debug-signed, installs directly for testing.
# - bandmoot-release: signed when keystore secrets exist, otherwise
#   app-release-unsigned.apk (sign before deploying, see README).
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # NOTE: android-actions/setup-android is intentionally NOT used: v3 requests
      # the obsolete 'tools' package and fails (sdkmanager exit 1). The runner
      # image already ships an Android SDK; we just top up what's missing.
      - name: Install Android platform + build-tools (compileSdk 34)
        run: |
          set -o pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7 (no wrapper in repo)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Restore release keystore (signed builds only)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "ANDROID_KEYSTORE_FILE=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build debug + release APKs
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:assembleRelease --stacktrace 2>&1 | tee gradle.log
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: List outputs
        if: always()
        run: |
          echo "=== apk ==="; ls -lh app/build/outputs/apk/debug app/build/outputs/apk/release 2>&1 || true
          echo "=== find apk ==="; find . -maxdepth 5 -name "*.apk" | xargs ls -lh 2>&1 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: gradle-log, path: gradle.log, if-no-files-found: warn}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with: {name: bandmoot-debug, path: app/build/outputs/apk/debug/app-debug.apk, if-no-files-found: warn}

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with: {name: bandmoot-release, path: app/build/outputs/apk/release/*.apk, if-no-files-found: warn}
